name: Windows setup scripts

on:
  push:
    paths: ['*.cmd', 'scripts/*.ps1', 'scripts/configure_codex.py', 'tests/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['*.cmd', 'scripts/*.ps1', 'scripts/configure_codex.py', 'tests/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test config round trips and double-click entry points
        run: python -m unittest discover -s tests -v
